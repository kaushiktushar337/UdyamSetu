[project]
name = "udyamsetu-backend"
version = "2.0.0"
description = "UdyamSetu FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "psycopg2-binary>=2.9,<3",
    "pgvector>=0.3,<1",
    "sentence-transformers>=3,<6",
    "numpy>=1.26,<3",
    "scikit-learn==1.8.0",
    "joblib>=1.3,<2",
    "requests>=2.32,<3",
    "pandas>=2.2,<4",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
